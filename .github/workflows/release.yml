name: Release (Windows)

# Builds the kikkoCode Windows installer with the opencode sidecar bundled.
# Triggered by pushing a version tag (e.g. v0.1.0), manually via the Actions
# tab, or by pushing a commit whose message contains "[release]" (the opt-in
# used when tag pushes aren't available in the current environment).
on:
  push:
    tags: ["v*"]
    branches: ["claude/opencode-project-setup-1i59cg"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create (e.g. v0.4.16)"
        required: true
        default: "v0.4.16"

permissions:
  contents: write

# Pin the bundled opencode engine. Keep this in sync with the pinned
# `@opencode-ai/sdk` version in package.json so the GUI and the engine speak
# the same API. Bump both together when upgrading the engine.
env:
  OPENCODE_VERSION: "1.17.13"

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    # On a branch push, only build when the commit opts in with "[release]" so
    # ordinary pushes don't kick off a full Windows build every time.
    if: >-
      github.ref_type == 'tag' ||
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[release]')
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Fetch the PINNED opencode engine from npm and place it as the Tauri
      # sidecar with the target-triple suffix Tauri expects. We pull the
      # platform package `opencode-windows-x64@<ver>` (which ships
      # `package/bin/opencode.exe`) rather than guessing a GitHub release asset
      # name — npm pins the exact version matching `@opencode-ai/sdk`. Keep
      # OPENCODE_VERSION in sync with the pinned SDK in package.json.
      - name: Fetch opencode sidecar (from npm, pinned)
        shell: pwsh
        run: |
          $triple = "x86_64-pc-windows-msvc"
          $dest = "src-tauri/binaries/opencode-$triple.exe"
          $ver = $env:OPENCODE_VERSION
          New-Item -ItemType Directory -Force -Path "src-tauri/binaries" | Out-Null
          Write-Host "npm pack opencode-windows-x64@$ver"
          npm pack "opencode-windows-x64@$ver" --pack-destination "$env:RUNNER_TEMP" 2>&1 | Write-Host
          $tgz = Get-ChildItem -Path "$env:RUNNER_TEMP" -Filter "opencode-windows-x64-*.tgz" | Select-Object -First 1
          if (-not $tgz) { throw "npm pack did not produce a tarball for opencode-windows-x64@$ver" }
          tar -xzf $tgz.FullName -C "$env:RUNNER_TEMP"
          $bin = Join-Path $env:RUNNER_TEMP "package/bin/opencode.exe"
          if (-not (Test-Path $bin)) { throw "opencode.exe not found in the npm package" }
          Copy-Item $bin $dest -Force
          Write-Host "Sidecar placed at $dest ($((Get-Item $dest).Length) bytes)"

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # On a tag push, github.ref_name is the tag (v*). On a manual
          # dispatch or a "[release]" branch push, use the input (or default
          # v0.1.0) so tauri-action creates a clean v* tag instead of the
          # branch name.
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || github.event.inputs.tag || 'v0.4.16' }}
          releaseName: "kikkoCode ${{ github.ref_type == 'tag' && github.ref_name || github.event.inputs.tag || 'v0.4.16' }}"
          # Give the GitHub Release page a description instead of an empty body.
          releaseBody: |
            Windows installer for kikkoCode. Download the `*_x64-setup.exe`
            (or the `.msi`) below and run it — the opencode engine is bundled.

            Already installed? kikkoCode updates itself from within the app.

            See the full changelog:
            https://github.com/daniele9233/forkClaudeCode/blob/claude/opencode-project-setup-1i59cg/CHANGELOG.md
          # Publish directly (not a draft) so the install.ps1 one-liner, which
          # reads /releases/latest, can find the installer with no manual
          # "Publish" click. A published release is created only when the build
          # succeeds, so a failed build never ships a broken release.
          releaseDraft: false
          prerelease: false
          # Merge the release-only overlay that adds the opencode sidecar
          # (externalBin) — kept out of the base config so `cargo check` / dev
          # don't require the (uncommitted) binary to be present.
          args: --target x86_64-pc-windows-msvc --config src-tauri/tauri.release.conf.json
